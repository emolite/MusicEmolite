<div class="p-1">
    <div class="mb-6">
        <h1 class="text-xl text-anm-title font-semibold leading-5">
            Danh sách danh mục
        </h1>
        <p class="text-sm text-anm-subtitle font-normal leading-5 mt-1">
            Danh mục món ăn trên toàn hệ thống FoodEmolite
        </p>
    </div>

    <div class="mb-4">
        <app-filter
            [fields]="filterFields"
            [initialValues]="filter()"
            (filterChange)="onFilterChange($event)">
        </app-filter>
    </div>

    <app-table
        [columns]="columns"
        [rows]="rows()"
        [loading]="loading()"
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        [totalRecords]="totalRecords()"
        [pageSize]="pageSize()"
        emptyText="Chưa có dữ liệu danh sách danh mục"
        [sortBy]="sortBy()"
        [asc]="asc()"
        (sortChange)="onSort($event)"
        (pageChange)="onPageChange($event)"
        (pageSizeChange)="onPageSizeChange($event)">
    </app-table>
</div>
