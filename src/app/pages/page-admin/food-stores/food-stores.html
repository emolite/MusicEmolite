<div class="p-1">
    <div class="mb-6 flex items-center justify-between">
        <div>
            <h1 class="text-3xl text-gray-900 font-bold">
                Danh sách cửa hàng
            </h1>
            <p class="mt-1 text-gray-400">
                Toàn bộ cửa hàng trên hệ thống FoodEmolite
            </p>
        </div>

        <button (click)="openCreateForm()"
            class="h-10 px-4 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold transition-colors cursor-pointer">
            + Thêm cửa hàng
        </button>
    </div>

    <app-table
        [columns]="columns"
        [rows]="rows()"
        [loading]="loading()"
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        (pageChange)="onPageChange($event)">
    </app-table>
</div>

@if (showCreateForm()) {
<div class="fixed inset-0 z-10000 flex items-center justify-center bg-black/40 px-4" (click)="closeCreateForm()">
    <div class="w-full max-w-md rounded-2xl bg-white shadow-2xl overflow-hidden" (click)="$event.stopPropagation()">
        <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
            <h3 class="text-lg font-bold text-gray-900">Thêm cửa hàng</h3>
            <button (click)="closeCreateForm()" [disabled]="creating()"
                class="w-7 h-7 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-gray-700 cursor-pointer disabled:opacity-40">
                ✕
            </button>
        </div>

        <div class="p-5 space-y-4 max-h-[70vh] overflow-y-auto">
            @if (createError()) {
            <p class="text-sm text-red-600 bg-red-50 rounded-lg px-3 py-2">{{ createError() }}</p>
            }

            <div>
                <label class="text-sm text-gray-600 mb-1 block">Tên cửa hàng *</label>
                <input [(ngModel)]="form.storeName"
                    class="w-full h-10 rounded-lg border border-gray-200 px-3 text-sm outline-none focus:border-blue-500" />
            </div>

            <div>
                <label class="text-sm text-gray-600 mb-1 block">Đại lý sở hữu *</label>
                <select [(ngModel)]="form.ownerAccountId"
                    class="w-full h-10 rounded-lg border border-gray-200 px-3 text-sm outline-none focus:border-blue-500 bg-white">
                    <option [ngValue]="null">-- Chọn đại lý --</option>
                    @for (agent of agents(); track agent.account?.id) {
                    <option [ngValue]="agent.account?.id">
                        {{ agent.profile?.fullName || agent.account?.username }}
                    </option>
                    }
                </select>
            </div>

            <div>
                <label class="text-sm text-gray-600 mb-1 block">Số điện thoại</label>
                <input [(ngModel)]="form.phoneNumber"
                    class="w-full h-10 rounded-lg border border-gray-200 px-3 text-sm outline-none focus:border-blue-500" />
            </div>

            <div>
                <label class="text-sm text-gray-600 mb-1 block">Địa chỉ</label>
                <input [(ngModel)]="form.address"
                    class="w-full h-10 rounded-lg border border-gray-200 px-3 text-sm outline-none focus:border-blue-500" />
            </div>

            <div>
                <label class="text-sm text-gray-600 mb-1 block">Mô tả</label>
                <textarea [(ngModel)]="form.description" rows="2"
                    class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm outline-none focus:border-blue-500"></textarea>
            </div>

            <div>
                <label class="text-sm text-gray-600 mb-1 block">Ảnh đại diện</label>
                <input type="file" accept="image/*" (change)="onFileSelected($event)" class="text-sm" />
            </div>
        </div>

        <div class="px-5 py-4 border-t border-gray-100 flex gap-3">
            <button (click)="closeCreateForm()" [disabled]="creating()"
                class="flex-1 h-10 rounded-lg border border-gray-300 text-sm font-medium text-gray-700 hover:bg-gray-50 cursor-pointer disabled:opacity-40">
                Huỷ
            </button>
            <button (click)="submitCreate()" [disabled]="creating()"
                class="flex-1 h-10 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold cursor-pointer disabled:opacity-40">
                {{ creating() ? 'Đang tạo...' : 'Tạo cửa hàng' }}
            </button>
        </div>
    </div>
</div>
}
