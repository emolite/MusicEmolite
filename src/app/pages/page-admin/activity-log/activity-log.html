<div class="p-1">
    <div class="mb-6 flex items-center justify-between">
        <div>
            <h1 class="text-3xl text-gray-900 font-bold">
                Lịch Sử Hoạt Động
            </h1>
            <p class="mt-1 text-gray-400">
                Nhật ký hoạt động của người dùng trên hệ thống
            </p>
        </div>

        <div class="inline-flex p-1 rounded-lg bg-gray-100">
            <button (click)="setTab('music')"
                class="px-4 py-2 rounded-md text-sm font-medium transition-colors cursor-pointer"
                [class.bg-white]="activeTab() === 'music'" [class.shadow]="activeTab() === 'music'"
                [class.text-gray-900]="activeTab() === 'music'" [class.text-gray-500]="activeTab() !== 'music'">
                MusicEmolite
            </button>
            <button (click)="setTab('food')"
                class="px-4 py-2 rounded-md text-sm font-medium transition-colors cursor-pointer"
                [class.bg-white]="activeTab() === 'food'" [class.shadow]="activeTab() === 'food'"
                [class.text-gray-900]="activeTab() === 'food'" [class.text-gray-500]="activeTab() !== 'food'">
                FoodEmolite
            </button>
        </div>
    </div>

    @if (activeTab() === 'music') {
    <div class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm mb-4">
        <div class="grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
            <div class="relative">
                <input type="text" id="music-keyword" [(ngModel)]="musicKeyword" (ngModelChange)="onMusicKeywordChange()"
                    placeholder=" "
                    class="peer w-full h-9 rounded-md border border-gray-200 bg-white px-3 text-sm text-gray-800 outline-none transition-all duration-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15" />
                <label for="music-keyword"
                    class="absolute left-3 top-1/2 -translate-y-1/2 scale-100 origin-left bg-white px-1 text-sm text-gray-400 duration-200 pointer-events-none
                        peer-focus:top-0 peer-focus:scale-75 peer-focus:text-blue-600
                        peer-not-placeholder-shown:top-0 peer-not-placeholder-shown:scale-75 peer-not-placeholder-shown:text-gray-500">
                    Tìm kiếm
                </label>
            </div>

            <app-dropdown label="Hành động" placeholder="Tất cả" [options]="musicActionOptions"
                [value]="musicActionType" (changed)="onMusicActionChange($event)">
            </app-dropdown>

            <app-date-picker label="Từ ngày" [value]="musicFromDate" (changed)="onMusicFromDateChange($event)">
            </app-date-picker>

            <app-date-picker label="Đến ngày" [value]="musicToDate" (changed)="onMusicToDateChange($event)">
            </app-date-picker>

            <button (click)="resetMusicFilter()"
                class="h-9 rounded-lg border border-gray-300 px-4 text-sm font-medium text-gray-700 hover:bg-gray-50 cursor-pointer">
                Đặt lại
            </button>
        </div>
    </div>

    <app-table
        [columns]="musicColumns"
        [rows]="musicLogs()"
        [loading]="loadingMusic()"
        [currentPage]="musicCurrentPage()"
        [totalPages]="musicTotalPages()"
        [asc]="musicAsc()"
        [sortBy]="'createdAt'"
        (sortChange)="onSortMusic($event)"
        (pageChange)="onMusicPageChange($event)">
    </app-table>
    } @else {
    <div class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm mb-4">
        <div class="grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
            <div class="relative">
                <input type="text" id="food-keyword" [(ngModel)]="foodKeyword" (ngModelChange)="onFoodKeywordChange()"
                    placeholder=" "
                    class="peer w-full h-9 rounded-md border border-gray-200 bg-white px-3 text-sm text-gray-800 outline-none transition-all duration-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15" />
                <label for="food-keyword"
                    class="absolute left-3 top-1/2 -translate-y-1/2 scale-100 origin-left bg-white px-1 text-sm text-gray-400 duration-200 pointer-events-none
                        peer-focus:top-0 peer-focus:scale-75 peer-focus:text-blue-600
                        peer-not-placeholder-shown:top-0 peer-not-placeholder-shown:scale-75 peer-not-placeholder-shown:text-gray-500">
                    Tìm kiếm
                </label>
            </div>

            <app-dropdown label="Hành động" placeholder="Tất cả" [options]="foodActionOptions"
                [value]="foodAction" (changed)="onFoodActionChange($event)">
            </app-dropdown>

            <app-date-picker label="Từ ngày" [value]="foodFromDate" (changed)="onFoodFromDateChange($event)">
            </app-date-picker>

            <app-date-picker label="Đến ngày" [value]="foodToDate" (changed)="onFoodToDateChange($event)">
            </app-date-picker>

            <button (click)="resetFoodFilter()"
                class="h-9 rounded-lg border border-gray-300 px-4 text-sm font-medium text-gray-700 hover:bg-gray-50 cursor-pointer">
                Đặt lại
            </button>
        </div>
    </div>

    <app-table
        [columns]="foodColumns"
        [rows]="foodLogs()"
        [loading]="loadingFood()"
        [currentPage]="foodCurrentPage()"
        [totalPages]="foodTotalPages()"
        [asc]="foodAsc()"
        [sortBy]="'createdAt'"
        (sortChange)="onSortFood($event)"
        (pageChange)="onFoodPageChange($event)">
    </app-table>
    }
</div>
