<div class="p-1">
    <div class="mb-6">
        <h1 class="text-xl text-anm-title font-semibold leading-5">
            Tần Suất
        </h1>
        <p class="text-sm text-anm-subtitle font-normal leading-5 mt-1">
            Tần suất sử dụng nhạc - lượt xem, lượt thích và người dùng
        </p>
    </div>

    <div class="grid grid-cols-1 xl:grid-cols-2 gap-4 mb-4">
        <div class="rounded-2xl bg-white p-5 shadow">
            <h2 class="mb-4 text-xl font-bold text-gray-900">Xu hướng 30 ngày qua</h2>

            @if (loadingTrend()) {
            <div class="h-87.5 flex flex-col justify-end gap-3 px-2 pb-6">
                <div class="flex-1 rounded-xl skeleton-shimmer"></div>
                <div class="h-3 w-2/3 mx-auto rounded-full skeleton-shimmer"></div>
            </div>
            } @else {
            <apx-chart
                [series]="lineChart.series"
                [chart]="lineChart.chart"
                [xaxis]="lineChart.xaxis"
                [yaxis]="lineChart.yaxis"
                [stroke]="lineChart.stroke"
                [dataLabels]="lineChart.dataLabels"
                [legend]="lineChart.legend">
            </apx-chart>
            }
        </div>

        <div class="rounded-2xl bg-white p-5 shadow">
            <h2 class="mb-4 text-xl font-bold text-gray-900">Tỷ lệ tổng quan</h2>

            @if (loadingSummary()) {
            <div class="h-87.5 flex flex-col items-center justify-center gap-4">
                <div class="w-48 h-48 rounded-full skeleton-shimmer"></div>
                <div class="h-3 w-40 rounded-full skeleton-shimmer"></div>
            </div>
            } @else {
            <apx-chart
                [series]="pieChart.series"
                [chart]="pieChart.chart"
                [labels]="pieChart.labels"
                [legend]="pieChart.legend"
                [responsive]="pieChart.responsive">
            </apx-chart>
            }
        </div>
    </div>

    <div>
        <h2 class="text-xl font-bold text-gray-900 mb-3">Tần suất sử dụng nhạc</h2>

        <app-table
            [columns]="songColumns"
            [rows]="songs()"
            [loading]="loadingSongList()"
            [currentPage]="songsCurrentPage()"
            [totalPages]="songsTotalPages()"
            [totalRecords]="songsTotalRecords()"
            [pageSize]="songsPageSize()"
            emptyText="Chưa có dữ liệu danh sách bài hát"
            [sortBy]="songsSortBy()"
            [asc]="songsAsc()"
            (sortChange)="onSortSongs($event)"
            (pageChange)="onSongsPageChange($event)"
            (pageSizeChange)="onSongsPageSizeChange($event)">
        </app-table>
    </div>
</div>
