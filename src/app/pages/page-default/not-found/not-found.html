<div class="min-h-screen bg-[#0f0d1a] text-white flex flex-col items-center justify-center px-4 text-center relative overflow-hidden">

  <div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 rounded-full bg-violet-600/10 blur-3xl pointer-events-none"></div>

  <div class="relative w-20 h-20 rounded-3xl bg-violet-600/10 flex items-center justify-center mb-6">
    <svg class="w-9 h-9 text-violet-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 10a7 7 0 11-14 0 7 7 0 0114 0z" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M9.5 9.5l3 3m0-3l-3 3" />
    </svg>
  </div>

  <h1 class="relative text-7xl md:text-8xl font-black bg-gradient-to-br from-violet-400 to-violet-700 bg-clip-text text-transparent tracking-tight">
    404
  </h1>

  <h2 class="relative text-xl md:text-2xl font-bold mt-4">Trang không tồn tại</h2>

  <p class="relative text-white/40 text-sm mt-3 max-w-sm leading-relaxed">
    Có vẻ như bạn đã truy cập một trang không tồn tại hoặc đã bị di chuyển.
  </p>

  <div class="relative flex items-center gap-3 mt-8">
    <button (click)="goBack()"
      class="h-11 px-6 rounded-full border border-white/15 text-white/70 hover:text-white hover:border-white/30 text-sm font-semibold transition-all cursor-pointer">
      Quay lại
    </button>

    <a routerLink="/users/home"
      class="h-11 px-6 rounded-full bg-violet-600 hover:bg-violet-500 text-white text-sm font-semibold transition-all flex items-center">
      Về trang chủ
    </a>
  </div>
</div>
