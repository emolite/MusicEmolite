<div class="w-full max-w-xl">
  <div class="mb-6 md:mb-8">
    <h1 class="text-2xl md:text-3xl font-bold text-white">Tài khoản &amp; mật khẩu</h1>
    <p class="text-white/50 mt-2">Quản lý tên đăng nhập và mật khẩu bảo mật tài khoản</p>
  </div>

  <div class="bg-white/[0.03] border border-white/10 rounded-xl p-4 md:p-5 mb-4">
    <h2 class="text-sm font-semibold text-white/70 uppercase tracking-wide mb-4">
      Tên đăng nhập
    </h2>

    <input type="text" [value]="user?.username || ''" disabled
      class="w-full px-3.5 py-2.5 rounded-lg bg-white/5 border border-white/10 text-sm text-white/50 outline-none cursor-not-allowed">

    <p class="text-xs text-white/30 mt-2">Tên đăng nhập không thể thay đổi.</p>
  </div>

  <div class="bg-white/[0.03] border border-white/10 rounded-xl p-4 md:p-5">
    <h2 class="text-sm font-semibold text-white/70 uppercase tracking-wide mb-4">
      Đổi mật khẩu
    </h2>

    <div class="space-y-4">
      <div>
        <label class="block text-xs text-white/50 mb-1.5">Mật khẩu hiện tại</label>
        <input type="password" [(ngModel)]="oldPassword"
          class="w-full px-3.5 py-2.5 rounded-lg bg-white/5 border border-white/10 text-sm text-white outline-none focus:border-violet-500">
      </div>

      <div>
        <label class="block text-xs text-white/50 mb-1.5">Mật khẩu mới</label>
        <input type="password" [(ngModel)]="newPassword"
          class="w-full px-3.5 py-2.5 rounded-lg bg-white/5 border border-white/10 text-sm text-white outline-none focus:border-violet-500">
      </div>

      <div>
        <label class="block text-xs text-white/50 mb-1.5">Xác nhận mật khẩu mới</label>
        <input type="password" [(ngModel)]="confirmPassword"
          class="w-full px-3.5 py-2.5 rounded-lg bg-white/5 border border-white/10 text-sm text-white outline-none focus:border-violet-500">
      </div>

      @if (error()) {
      <p class="text-xs text-red-400">{{ error() }}</p>
      }

      <div class="flex justify-end">
        <button (click)="changePassword()" [disabled]="loading()"
          class="px-5 py-2.5 rounded-lg bg-violet-600 hover:bg-violet-500 text-sm text-white font-semibold transition-all cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
          {{ loading() ? 'Đang xử lý...' : 'Đổi mật khẩu' }}
        </button>
      </div>
    </div>
  </div>
</div>
