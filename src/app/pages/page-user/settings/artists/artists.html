<div class="w-full">
  <div class="mb-6 md:mb-8">
    <h1 class="text-2xl md:text-3xl font-bold text-white">Nghệ sĩ</h1>
    <p class="text-white/50 mt-2">Danh sách nghệ sĩ trong hệ thống</p>
  </div>

  <input type="text" placeholder="Tìm nghệ sĩ..." [value]="keyword()"
    (input)="onSearch($any($event.target).value)"
    class="w-full md:max-w-sm mb-5 px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-white/30 outline-none focus:border-violet-500" />

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
    @for (artist of artists(); track artist.id) {
    <a [routerLink]="['/users/artist', artist.id]"
      class="flex items-center gap-3 bg-white/[0.03] border border-white/10 rounded-xl p-4 hover:bg-white/5 hover:border-violet-500/25 transition-all">
      @if (artist.url) {
      <img [src]="artist.url" class="w-10 h-10 rounded-full object-cover shrink-0">
      } @else {
      <div
        class="w-10 h-10 rounded-full bg-violet-600/30 flex items-center justify-center text-sm font-bold text-violet-300 shrink-0">
        {{ (artist.stageName || artist.name).charAt(0) }}
      </div>
      }
      <div class="min-w-0">
        <p class="text-sm font-semibold text-white truncate">{{ artist.stageName || artist.name }}</p>
        @if (artist.country) {
        <p class="text-xs text-white/40 truncate">{{ artist.country }}</p>
        }
      </div>
    </a>
    }
    @empty {
    <p class="text-white/30 text-sm py-6 col-span-full text-center">Không tìm thấy nghệ sĩ nào</p>
    }
  </div>
</div>
