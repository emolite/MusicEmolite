<div class="h-screen overflow-hidden bg-[#0f0d1a] text-white flex flex-col">
  @if (showBrowserWarning()) {
  <div
    class="shrink-0 z-50 w-full bg-violet-600/15 backdrop-blur-xl border-b border-violet-500/20 px-4 md:px-8 py-2.5 flex items-center gap-3">
    <svg class="w-4.5 h-4.5 text-violet-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2"
      viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M7.5 12l4.5 4.5m0 0l4.5-4.5m-4.5 4.5V3" />
    </svg>

    <div class="flex-1 min-w-0 text-xs md:text-sm text-white leading-snug">
      <p>Tải ứng dụng Song with me về điện thoại để có trải nghiệm tốt nhất</p>
      <p class="text-white/50">Download the Song with me app on your phone for the best experience</p>
    </div>

    <a [href]="androidApkUrl" target="_blank" rel="noopener"
      class="shrink-0 inline-flex items-center gap-1.5 rounded-full bg-violet-600 hover:bg-violet-500 px-3.5 py-2 text-xs font-semibold text-white transition-colors">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M7.5 12l4.5 4.5m0 0l4.5-4.5m-4.5 4.5V3" />
      </svg>
      Tải xuống
    </a>

    <button type="button" (click)="dismissBrowserWarning()"
      class="shrink-0 w-7 h-7 rounded-full flex items-center justify-center text-violet-300/70 hover:text-white hover:bg-violet-500/20 transition-colors cursor-pointer">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
  }

  <div class="relative flex-1 min-h-0 flex" style="transform: translateZ(0);">
    <app-sidebar></app-sidebar>

    <div class="h-full flex-1 min-w-0 flex flex-col md:ml-64">
      <app-topbar class=""></app-topbar>

      <main class="relative flex-1 overflow-y-auto app-content">
        <router-outlet></router-outlet>
        @if (showFooter()) {
        <app-user-footer></app-user-footer>
        }
      </main>
    </div>
  </div>

  <app-player-bar></app-player-bar>
  <app-player-bar-detail></app-player-bar-detail>
</div>
