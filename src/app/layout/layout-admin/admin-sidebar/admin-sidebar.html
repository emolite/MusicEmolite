<nav class="w-60 h-screen bg-white border-r border-gray-200 flex flex-col shrink-0">
    <div class="h-16 px-3 border-b border-gray-100 flex items-center">
        <a routerLink="dashboard"
            class="group flex items-center gap-3 w-full px-2 py-2 rounded-xl transition-colors hover:bg-violet-50">
            <img src="logoMusic.png" alt="EmoLite"
                class="w-10 h-10 rounded-xl object-cover shrink-0 shadow-sm ring-1 ring-black/5 transition-transform duration-200 group-hover:scale-105 group-hover:ring-violet-200">
            <p class="text-lg font-bold tracking-tight leading-none whitespace-nowrap bg-linear-to-r from-violet-600 to-blue-600 bg-clip-text text-transparent">
                Emolite Admin
            </p>
        </a>
    </div>

    <div class="flex-1 overflow-y-auto py-4 px-3 flex flex-col gap-6 admin-scroll">
        @for (section of menuSections; track section.title) {
        <div>
            <p class="text-[12px] font-semibold tracking-widest text-gray-400 uppercase px-2 mb-2">{{ section.title }}</p>
            <ul class="space-y-0.5">
                @for (item of section.items; track item.url) {
                <li>
                    <a [routerLink]="item.url" routerLinkActive="-ml-3 pl-4! bg-blue-50 text-anm-main! font-semibold border-l-4 border-blue-600"
                        class="flex items-center gap-3 px-2 py-2 text-sm text-gray-500 hover:bg-blue-50 transition-colors">
                        <span class="shrink-0" [innerHTML]="icon(item.icon)"></span>
                        {{ item.label }}
                    </a>
                </li>
                }
            </ul>
        </div>
        }
    </div>

    <div class="px-3 py-4 border-t border-gray-100">
        <div class="flex items-center gap-2.5 px-2 py-2 rounded-md hover:bg-blue-50 transition-colors">
            <a routerLink="profile" class="flex flex-1 min-w-0 items-center gap-2.5">
                @if(profileUri) {
                <img [src]="profileUri" class="w-10 h-10 rounded-full object-cover border border-white/10">
                } @else {
                <div
                    class="w-7 h-7 rounded-md bg-blue-600 flex items-center justify-center text-white text-xs font-semibold shrink-0">
                    {{ displayName.charAt(0) || 'U' }}
                </div>
                }
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium text-gray-800 truncate">{{displayName}}</p>
                    <p class="text-[11px] text-gray-400 truncate">{{ user()?.userType }}</p>
                </div>
            </a>
            <button (click)="logout()"
                class="w-7 h-7 flex items-center justify-center rounded text-gray-400 hover:text-blue-600 hover:bg-blue-50 transition-colors shrink-0"
                title="Đăng xuất">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" width="15" height="15">
                    <path d="M13 4.5h2.5a1 1 0 011 1v9a1 1 0 01-1 1H13" stroke-linecap="round" />
                    <path d="M8.5 13.5L12 10l-3.5-3.5M12 10H4" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </button>
        </div>
    </div>
</nav>
