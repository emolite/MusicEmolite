@if (open) {
<div class="fixed inset-0 z-10000 flex justify-end">
  <div class="panel-backdrop absolute inset-0 bg-black/30" (click)="close()"></div>

  <div class="panel-slide relative w-full max-w-md h-full bg-white shadow-2xl overflow-y-auto admin-scroll">
    <div class="sticky top-0 bg-white border-b border-gray-100 px-6 py-4 flex items-center justify-between z-10">
      <h2 class="text-lg font-bold text-blue-600 truncate">{{ title }}</h2>

      <button (click)="close()"
        class="w-8 h-8 shrink-0 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-gray-700 transition-colors cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="p-6">
      <ng-content></ng-content>
    </div>
  </div>
</div>
}
