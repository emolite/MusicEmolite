<div class="relative w-full" (click)="$event.stopPropagation()">
  <button type="button" (click)="toggle()" [disabled]="disabled"
    class="w-full h-9 flex items-center justify-between rounded-md border bg-white px-3 text-sm text-left outline-none transition-all duration-200 cursor-pointer"
    [class.border-blue-500]="isOpen" [class.ring-2]="isOpen" [class.ring-blue-500/15]="isOpen"
    [class.border-gray-200]="!isOpen" [class.opacity-50]="disabled" [class.cursor-not-allowed]="disabled">

    <span [class.text-gray-400]="!value" [class.text-gray-800]="!!value">
      {{ displayLabel || (label ? '' : placeholder) }}
    </span>

    <svg class="w-4 h-4 shrink-0 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
      <rect x="3" y="5" width="18" height="16" rx="2" />
      <path d="M3 9h18M8 3v4M16 3v4" stroke-linecap="round" />
    </svg>
  </button>

  @if (label) {
  <label (click)="toggle()"
    class="absolute left-3 bg-white px-1 text-sm duration-200 pointer-events-none origin-left cursor-pointer"
    [class]="(isOpen || value) ? 'top-0 -translate-y-1/2 scale-75 text-blue-600' : 'top-1/2 -translate-y-1/2 scale-100 text-gray-400'">
    {{ label }}
  </label>
  }

  @if (isOpen) {
  <div class="absolute z-50 mt-1 w-72 rounded-md border border-gray-200 bg-white shadow-lg p-3">
    <div class="flex items-center justify-between mb-2">
      <button type="button" (click)="prevMonth()"
        class="w-7 h-7 rounded hover:bg-gray-100 flex items-center justify-center text-gray-500 cursor-pointer">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
      </button>

      <span class="text-sm font-semibold text-gray-800">{{ monthLabels[viewMonth] }} {{ viewYear }}</span>

      <button type="button" (click)="nextMonth()"
        class="w-7 h-7 rounded hover:bg-gray-100 flex items-center justify-center text-gray-500 cursor-pointer">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
      </button>
    </div>

    <div class="grid grid-cols-7 gap-1 mb-1">
      @for (d of dayLabels; track d) {
      <div class="text-center text-[11px] font-medium text-gray-400 py-1">{{ d }}</div>
      }
    </div>

    @for (week of weeks; track $index) {
    <div class="grid grid-cols-7 gap-1">
      @for (day of week; track $index) {
      <button type="button" [disabled]="!day" (click)="day && selectDay(day)"
        class="h-8 rounded-md text-sm transition-colors"
        [class.invisible]="!day"
        [class.cursor-pointer]="day"
        [class.bg-blue-600]="day && isSelected(day)"
        [class.text-white]="day && isSelected(day)"
        [class.font-semibold]="day && isToday(day) && !isSelected(day)"
        [class.text-blue-600]="day && isToday(day) && !isSelected(day)"
        [class.text-gray-700]="day && !isSelected(day) && !isToday(day)"
        [class.hover:bg-gray-100]="day && !isSelected(day)">
        {{ day }}
      </button>
      }
    </div>
    }

    @if (value) {
    <div class="mt-2 pt-2 border-t border-gray-100 text-right">
      <button type="button" (click)="clear()" class="text-xs text-gray-400 hover:text-gray-600 cursor-pointer">
        Xoá ngày
      </button>
    </div>
    }
  </div>
  }
</div>
