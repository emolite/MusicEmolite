<div class="flex items-center justify-center gap-2 sm:gap-3">
    @for (i of indexes; track i) {
    <input #digitInput
        type="text"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="1"
        [value]="digits[i]"
        [disabled]="disabled"
        (input)="onInput($event, i)"
        (keydown)="onKeydown($event, i)"
        (paste)="onPaste($event, i)"
        class="w-11 h-14 sm:w-12 sm:h-14 rounded-xl border bg-white/5 text-center text-xl font-semibold tracking-normal
        outline-none transition-all duration-200 focus:scale-105 disabled:opacity-50 disabled:cursor-not-allowed"
        [class.border-red-500]="invalid"
        [class.text-red-300]="invalid"
        [class.border-white/15]="!invalid"
        [class.focus:border-violet-500]="!invalid"
        [class.focus:ring-2]="!invalid"
        [class.focus:ring-violet-500/30]="!invalid">
    }
</div>
