<div class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm">

    <form [formGroup]="form" class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-4">

        @for(field of fields; track field.key) {

        <div>

            @switch (field.type) {

            @case ('text') {

            <div class="relative">
                <input type="text" [id]="'filter-' + field.key" [formControlName]="field.key" placeholder=" "
                    class="peer w-full h-9 rounded-md border border-gray-200 bg-white px-3 text-sm text-gray-800 outline-none transition-all duration-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15" />

                <label [for]="'filter-' + field.key"
                    class="absolute left-3 top-1/2 -translate-y-1/2 scale-100 origin-left bg-white px-1 text-sm text-gray-400 duration-200 pointer-events-none
                        peer-focus:top-0 peer-focus:scale-75 peer-focus:text-blue-600
                        peer-not-placeholder-shown:top-0 peer-not-placeholder-shown:scale-75 peer-not-placeholder-shown:text-gray-500">
                    {{ field.label }}
                </label>
            </div>

            }

            @case ('select') {

            <app-dropdown [options]="field.options || []" [label]="field.label" [placeholder]="field.placeholder || 'Chọn'"
                [value]="form.get(field.key)?.value" (changed)="onDropdownChange(field.key, $event?.value)">
            </app-dropdown>

            }

            }

        </div>

        }

        <div class="flex items-center">

            <button type="button" (click)="onReset()"
                class="h-9 rounded-lg border border-gray-300 px-4 text-sm font-medium text-gray-700 transition hover:bg-gray-50 cursor-pointer">

                Đặt lại

            </button>

        </div>

    </form>

</div>
